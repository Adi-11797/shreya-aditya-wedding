<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RSVP — Shreya &amp; Aditya</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Cormorant+SC:wght@300;400;500&family=Jost:wght@200;300;400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --cream:#f7ede2;
  --parch:rgba(246,236,218,0.90);
  --gold:#b8862a;
  --gold-lt:#d4a84b;
  --brown:#3b1e07;
  --brown-mid:#7a4f28;
  --txt:#2e1a06;
  --txt-mid:#6b4e2e;
  --txt-lt:#8a6840;
}

html,body{
  height:100%;
  font-family:'Jost',sans-serif;
  font-weight:300;
  color:var(--txt);
  overflow:hidden;
}

/* ── BACKGROUND — same pattern as index.html ── */
body::after{
  content:'';
  position:fixed;
  inset:0;
  z-index:-1;
  background-repeat:no-repeat;
  background-position:center center;
  background-size:cover;
  background-image:url("images/BG-2_16x9.png");
}
/* @media (max-aspect-ratio:1.45/1) and (min-aspect-ratio:1.15/1){
  body::after{background-image:url("images/bg-4x3.webp");}
}
  
@media (max-aspect-ratio:1.15/1) and (min-aspect-ratio:0.85/1){
  body::after{background-image:url("images/bg-1x1.webp");}
}
@media (max-aspect-ratio:0.85/1) and (min-aspect-ratio:0.62/1){
  body::after{background-image:url("images/bg-3x4.webp");}
}*/
@media (max-aspect-ratio:2/1) and (min-aspect-ratio:1.9/1){
  body::after{background-image:url("images/BG-2_16x9.png");}
}
@media (max-aspect-ratio:0.62/1) and (min-aspect-ratio:0.50/1){
  body::after{background-image:url("images/BG-2.png");}
}
/* 
@media (max-aspect-ratio:0.50/1) and (min-aspect-ratio:0.44/1){
  body::after{background-image:url("images/bg-9x19.webp");}
}
@media (max-aspect-ratio:0.44/1){
  body::after{background-image:url("images/bg-9x21.webp");}
} */

/* ── OUTER WRAPPER — fills viewport, centres the card ── */
.page{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(1rem,3vh,2.5rem) clamp(1rem,4vw,3rem);
}

/* ── CARD ── */
.card{
  width:100%;
  max-width:min(960px, calc(100vw - 2rem));
  max-height:calc(100vh - clamp(2rem,6vh,5rem));
  overflow-y:auto;
  background:var(--parch);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border:1px solid rgba(184,134,42,0.28);
  box-shadow:0 32px 100px rgba(59,30,7,0.22),0 4px 20px rgba(59,30,7,0.12);
  /* Thin inner border */
  position:relative;
  animation:cardIn 0.85s cubic-bezier(0.22,1,0.36,1) both;
}
.card::before{
  content:'';
  position:absolute;
  inset:10px;
  border:1px solid rgba(184,134,42,0.13);
  pointer-events:none;
  z-index:0;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px) scale(0.988);}
  to{opacity:1;transform:translateY(0) scale(1);}
}
.card::-webkit-scrollbar{width:4px;}
.card::-webkit-scrollbar-track{background:transparent;}
.card::-webkit-scrollbar-thumb{background:rgba(184,134,42,0.3);border-radius:2px;}

/* ── CARD INNER LAYOUT ── */
.card-inner{
  position:relative;
  z-index:1;
  padding:clamp(1.6rem,3.5vh,2.8rem) clamp(1.8rem,4vw,4rem);
}

/* ── HEADER ── */
.header{
  text-align:center;
  margin-bottom:clamp(0.8rem,2vh,1.4rem);
}
.lbl{
  font-family:'Cormorant SC',serif;font-weight:300;
  font-size:0.62rem;letter-spacing:0.45em;color:var(--gold);
  display:block;margin-bottom:0.3rem;
}
.names{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(1.7rem,3.5vw,2.6rem);color:var(--brown);line-height:1.1;
}
.names em{font-style:italic;color:var(--gold);}
.sub{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  font-size:clamp(0.8rem,1.4vw,0.95rem);color:var(--txt-lt);margin-top:0.25rem;
}

/* ── DIVIDER ── */
.divr{
  display:flex;align-items:center;gap:0.75rem;
  justify-content:center;margin:clamp(0.6rem,1.5vh,1rem) auto;max-width:200px;
}
.divr::before,.divr::after{
  content:'';flex:1;height:1px;
  background:linear-gradient(to right,transparent,rgba(184,134,42,0.45));
}
.divr::after{background:linear-gradient(to left,transparent,rgba(184,134,42,0.45));}
.divr-gem{width:4px;height:4px;background:var(--gold);transform:rotate(45deg);opacity:0.7;flex-shrink:0;}

/* ── FORM GRID — 2 col on wide, 1 col on mobile ── */
.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:clamp(0.65rem,1.5vh,1rem) clamp(1rem,2.5vw,2rem);
  margin-top:clamp(0.8rem,2vh,1.4rem);
}
/* Full-width fields */
.span-2{grid-column:1/-1;}

.f-group{display:flex;flex-direction:column;gap:0.3rem;}
.f-group label{
  font-family:'Cormorant SC',serif;font-weight:300;
  font-size:0.56rem;letter-spacing:0.26em;color:var(--txt-mid);
}
.f-group input,
.f-group select,
.f-group textarea{
  background:rgba(250,242,228,0.88);
  border:1px solid rgba(184,134,42,0.24);
  padding:clamp(0.5rem,1.1vh,0.75rem) 0.9rem;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.9rem,1.5vw,1rem);
  color:var(--txt);outline:none;
  transition:border-color 0.2s,background 0.2s;
  width:100%;appearance:none;border-radius:0;
}
.f-group input:focus,
.f-group select:focus,
.f-group textarea:focus{
  border-color:var(--gold);
  background:rgba(255,248,238,0.97);
}
.f-group textarea{resize:none;height:clamp(54px,8vh,72px);}

/* Attend toggle */
.toggle-row{display:flex;border:1px solid rgba(184,134,42,0.24);overflow:hidden;}
.toggle-row input[type=radio]{display:none;}
.toggle-row label{
  flex:1;text-align:center;
  padding:clamp(0.5rem,1.1vh,0.72rem);
  cursor:pointer;
  font-family:'Cormorant SC',serif;font-weight:300;
  font-size:0.6rem;letter-spacing:0.18em;color:var(--txt-mid);
  transition:all 0.2s;
}
.toggle-row input[type=radio]:checked+label{background:var(--gold);color:var(--cream);}
.toggle-row label:last-of-type{border-left:1px solid rgba(184,134,42,0.24);}

/* Checkboxes — side by side on wide */
.check-block{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:0.5rem;
  padding:clamp(0.55rem,1.2vh,0.85rem) clamp(0.65rem,1.2vw,0.9rem);
  background:rgba(250,242,228,0.88);
  border:1px solid rgba(184,134,42,0.24);
}
.check-block input[type=checkbox]{display:none;}
.check-block label{
  display:flex;align-items:center;gap:0.55rem;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.82rem,1.3vw,0.95rem);
  color:var(--txt-mid);cursor:pointer;
  padding:clamp(0.3rem,0.8vh,0.5rem) clamp(0.4rem,0.8vw,0.7rem);
  border:1px solid transparent;transition:all 0.2s;
}
.check-block label:has(input:checked){
  border-color:var(--gold);background:rgba(184,134,42,0.07);color:var(--brown);
}
.check-block label::before{
  content:'○';color:rgba(184,134,42,0.4);flex-shrink:0;font-size:0.82rem;
}
.check-block label:has(input:checked)::before{content:'✓';color:var(--gold);}

/* Submit row */
.submit-row{
  display:flex;justify-content:center;gap:0.75rem;
  margin-top:clamp(0.8rem,1.8vh,1.2rem);flex-wrap:wrap;
}
.sub-btn{
  font-family:'Cormorant SC',serif;font-weight:400;
  font-size:0.7rem;letter-spacing:0.28em;
  color:var(--cream);background:var(--brown);
  border:1px solid var(--brown);
  padding:clamp(0.7rem,1.4vh,0.95rem) clamp(1.8rem,3.5vw,2.8rem);
  cursor:pointer;transition:all 0.25s;border-radius:0;
}
.sub-btn:hover{background:var(--gold);border-color:var(--gold);}
.sub-btn:disabled{opacity:0.55;cursor:not-allowed;}
.cal-btn{
  font-family:'Cormorant SC',serif;font-weight:400;
  font-size:0.7rem;letter-spacing:0.28em;
  color:var(--brown);background:transparent;
  border:1px solid rgba(184,134,42,0.35);
  padding:clamp(0.7rem,1.4vh,0.95rem) clamp(1.8rem,3.5vw,2.8rem);
  cursor:pointer;transition:all 0.25s;border-radius:0;
}
.cal-btn:hover{background:rgba(184,134,42,0.07);}

/* Success / Fallback */
.success-box{
  display:none;text-align:center;
  padding:clamp(1.5rem,4vh,3rem) 1rem;
  animation:cardIn 0.7s ease both;
}
.success-box h3{
  font-family:'Cormorant Garamond',serif;font-weight:300;
  font-size:clamp(1.7rem,3vw,2.3rem);color:var(--brown);margin:0.6rem 0 0.4rem;
}
.success-box p{
  font-family:'Jost',sans-serif;font-weight:300;
  color:var(--txt-mid);font-size:0.9rem;line-height:1.75;
}
.success-box .sig{
  font-family:'Cormorant Garamond',serif;font-style:italic;
  color:var(--gold);font-size:1.1rem;margin-top:0.8rem;display:block;
}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  .form-grid{grid-template-columns:1fr;}
  .span-2{grid-column:1;}
  .check-block{grid-template-columns:1fr;}
  body,html{overflow:hidden;}
  .card{max-height:calc(100vh - 1.5rem);}
}
@media(prefers-reduced-motion:reduce){
  .card{animation:none;}
}
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <div class="card-inner">

      <!-- Header -->
      <div class="header">
        <span class="lbl">Kindly RSVP</span>
        <p class="names">Shreya <em>&amp;</em> Aditya</p>
        <p class="sub">The Peacock Grove, Bengaluru &nbsp;&middot;&nbsp; 30 August 2026</p>
      </div>

      <div class="divr"><span class="divr-gem"></span></div>

      <!-- Form -->
      <form id="rsvpForm" novalidate>
        <div class="form-grid">

          <!-- Name row -->
          <div class="f-group">
            <label>First Name</label>
            <input type="text" name="firstName" placeholder="Ananya" required>
          </div>
          <div class="f-group">
            <label>Last Name</label>
            <input type="text" name="lastName" placeholder="Bhat" required>
          </div>

          <!-- Email + Phone -->
          <div class="f-group">
            <label>Email Address</label>
            <input type="email" name="email" placeholder="ananya@example.com" required>
          </div>
          <div class="f-group">
            <label>Phone Number</label>
            <input type="tel" name="phone" placeholder="+91 98765 43210">
          </div>

          <!-- Attending toggle — half width -->
          <div class="f-group">
            <label>Will you be attending?</label>
            <div class="toggle-row">
              <input type="radio" name="att" id="a-yes" value="yes" checked>
              <label for="a-yes">Joyfully Accept</label>
              <input type="radio" name="att" id="a-no" value="no">
              <label for="a-no">Regretfully Decline</label>
            </div>
          </div>

          <!-- Guests — half width -->
          <div class="f-group">
            <label>Number of Guests</label>
            <select name="guests">
              <option value="">Please select</option>
              <option>1</option><option>2</option><option>3</option><option>4</option>
              <option>5</option><option>6</option><option>7</option><option>8</option>
              <option>9</option><option>10</option><option>11</option><option>12</option>
              <option>13</option><option>14</option><option>15</option><option>16+</option>
            </select>
          </div>

          <!-- Events — full width, side-by-side checkboxes -->
          <div class="f-group span-2">
            <label>Which events will you attend?</label>
            <div class="check-block">
              <label><input type="checkbox" name="ev_oonjal" value="yes" unchecked> Oonjal &mdash; 30 August, 8:00 AM</label>
              <label><input type="checkbox" name="ev_muhurtham" value="yes" unchecked> Muhurtham &mdash; 30 August, 11:00 AM</label>
            </div>
          </div>

          <!-- Message — full width -->
          <div class="f-group span-2">
            <label>A message for the couple</label>
            <textarea name="message" placeholder="Share your heartfelt wishes…"></textarea>
          </div>

        </div><!-- /form-grid -->

        <div class="submit-row">
          <button type="submit" class="sub-btn" id="submitBtn">Send RSVP</button>
          <button type="button" class="cal-btn" onclick="window.location.href='calendar.ics'">Add to Calendar</button>
        </div>
      </form>

      <!-- Success -->
      <div class="success-box" id="rsvpSuccess">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none" style="display:block;margin:0 auto 0.65rem;">
          <circle cx="24" cy="24" r="22" fill="none" stroke="#b8862a" stroke-width="1"/>
          <path d="M12 24 L20 32 L36 16" stroke="#b8862a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <h3>Thank you</h3>
        <p>Your RSVP has been received.<br>We look forward to celebrating with you.</p>
        <span class="sig">&mdash; Shreya &amp; Aditya</span>
      </div>

      <!-- Fallback -->
      <div class="success-box" id="rsvpFallback" style="display:none;">
        <svg width="44" height="44" viewBox="0 0 48 48" fill="none" style="display:block;margin:0 auto 0.65rem;">
          <circle cx="24" cy="24" r="22" fill="none" stroke="#b8862a" stroke-width="1"/>
          <path d="M24 14 L24 26" stroke="#b8862a" stroke-width="1.6" stroke-linecap="round"/>
          <circle cx="24" cy="32" r="1.5" fill="#b8862a"/>
        </svg>
        <h3 style="font-size:1.5rem;">Something went wrong</h3>
        <p>Our form couldn't submit right now. Please email your RSVP instead.</p>
        <button class="sub-btn fallback-send" style="margin-top:1rem;">Send via Email</button>
      </div>

    </div><!-- /card-inner -->
  </div><!-- /card -->
</div><!-- /page -->

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzwiGLO7m3Ooxdc5lCPFankcbPZoCTUxLxhC7H0UvkCd7Jjev3j-ljXnXZJV73TzlNtog/exec';
const FALLBACK_EMAIL = 'adityaramakrishnan11@gmail.com';

function openMailtoFallback(data) {
  const events = [
    data.oonjal  === 'Yes' ? 'Oonjal'  : null,
    data.muhurtham === 'Yes' ? 'Muhurtham' : null,
  ].filter(Boolean).join(', ') || 'None';

  const body = [
    `Name: ${data.firstName} ${data.lastName}`,
    `Email: ${data.email}`,
    `Phone: ${data.phone}`,
    `Attending: ${data.attending}`,
    `Guests: ${data.guests}`,
    `Events: ${events}`,
    `Message: ${data.message || '—'}`,
    `Submitted: ${data.submittedAt}`,
  ].join('\n');

  window.location.href =
    `mailto:${FALLBACK_EMAIL}`
    + `?subject=${encodeURIComponent('RSVP — Shreya & Aditya')}`
    + `&body=${encodeURIComponent(body)}`;
}

document.getElementById('rsvpForm').addEventListener('submit', async function(e) {
  e.preventDefault();

  const btn = document.getElementById('submitBtn');
  btn.textContent = 'Sending…';
  btn.disabled = true;

  const form = e.target;
  const data = {
    firstName:   form.firstName.value.trim(),
    lastName:    form.lastName.value.trim(),
    email:       form.email.value.trim(),
    phone:       form.phone.value.trim(),
    attending:   form.querySelector('input[name="att"]:checked').value,
    guests:      form.guests.value,
    oonjal:     form.ev_oonjal.checked  ? 'Yes' : 'No',
    muhurtham:    form.ev_muhurtham.checked ? 'Yes' : 'No',
    message:     form.message.value.trim(),
    submittedAt: new Date().toLocaleString('en-IN', {timeZone:'Asia/Kolkata'}),
  };

  try {
    const response = await fetch(SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data),
    });
    const result = await response.json();
    if(result.result !== 'ok') throw new Error('error');

    form.style.display = 'none';
    document.getElementById('rsvpSuccess').style.display = 'block';

  } catch(err) {
    btn.textContent = 'Send RSVP';
    btn.disabled = false;
    const fb = document.getElementById('rsvpFallback');
    fb.style.display = 'block';
    fb.querySelector('.fallback-send').onclick = () => openMailtoFallback(data);
  }
});
</script>
</body>
</html>
